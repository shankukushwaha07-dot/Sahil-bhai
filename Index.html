<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAHIL BHAI | Telegram Channel</title>

    <link rel="stylesheet" href="style.css">

    <!-- Telegram icon -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="page">

        <section class="landing-card">

            <!-- Top Badge -->
            <div class="live-badge">
                <span class="live-dot"></span>
                LIVE TELEGRAM CHANNEL
            </div>

            <!-- Main Heading -->
            <h1>SAHIL BHAI</h1>

            <!-- Description -->
            <p class="description">
                Your daily dose of updates, news, and
                exclusive content — delivered straight to
                Telegram.
            </p>

            <!-- Features -->
            <div class="features">

                <div class="feature">
                    <span>⚡</span>
                    Daily Posts
                </div>

                <div class="feature">
                    <span>🔒</span>
                    100% Free
                </div>

                <div class="feature">
                    <span>🚀</span>
                    No Spam
                </div>

            </div>

            <!-- Telegram Button -->
            <a
                href="https://t.me/YOUR_CHANNEL"
                class="telegram-button"
                target="_blank"
                rel="noopener noreferrer"
            >
                <i class="fa-brands fa-telegram"></i>
                <span>Join Now on Telegram</span>
            </a>

            <!-- Small text -->
            <p class="join-text">
                Tap to join instantly — no sign-up needed
            </p>

            <!-- Footer -->
            <div class="footer">

                <div class="footer-title">
                    S A H I L &nbsp; B H A I &nbsp; F U L L &nbsp; P O W E R
                </div>

                <div class="made-by">
                    Made by <strong>SAHIL ADS</strong>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
